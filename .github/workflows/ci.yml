name: Deploy FastAPI to AWS ECR

on:
  push:
    # 當我們 push 到 main 分支時觸發
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          # 先執行基本測試
          pytest --cov=. --cov-report=term-missing

  build-and-push-aws:
    name: Build and Push to Amazon ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # 【核心步驟 1】持你剛拿到的兩把鑰匙，登入 AWS 警衛室
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1 # 確認是東京區域

      # 【核心步驟 2】讓這台 GitHub 伺服器登入 AWS 的 ECR 倉庫
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 【核心步驟 3】打包 Docker Image 並推送到 AWS ECR 倉庫
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # ⚠️ 這裡要換成你剛才在 AWS ECR 建立的「儲存庫名稱」
          ECR_REPOSITORY: fastapi-mysql-app 
          IMAGE_TAG: latest
        run: |
          # 這裡會自動幫你用 AWS 的長網址做正確的 Tag 命名並 Push
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
